<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>selection-ask panel smoke</title>
<style>body{font:14px/1.6 -apple-system,sans-serif;margin:0;padding:24px;--dsw-alias-bg-base:#fff;--dsw-alias-border-l3:#e2e4e9}</style>
</head>
<body>
  <!-- Real React 18 UMD; stub host services; fake transport answering the plugin routes. -->
  <section data-conversation-scroll><div data-chat-flow-kind="turn-process" data-chat-turn="2"><pre id="tool">npm test passed: 26 tests</pre></div></section>
  <div id="overlay"></div>
<script src="/mermaid-diagrams-preview/node_modules/react/umd/react.development.js"></script>
<script src="/mermaid-diagrams-preview/node_modules/react-dom/umd/react-dom.development.js"></script>
<script>
  window.__ModuleLoader__ = { load(registration) { window.__registration = registration } }
  window.calls = []
  const markdownSeen = []
  const view = (threadId) => ({ ok: true, revision: 'e:' + window.calls.length, running: false, live: true, stream: null, pending: [], error: null, trimmed: false,
    thread: { id: threadId, title: 'q', selection: { kind: 'chat', role: 'tool', turn: 2, text: 'npm test passed' } },
    model: { provider: 'claude-relay', model: 'claude-opus-5-5', name: 'Claude Opus 5.5', reasoningEffort: 'high', effortName: 'High', images: true },
    cwd: '/repo/work', messages: [{ id: 'u1', role: 'user', text: '这是什么', images: 1 }, { id: 'a1', role: 'assistant', text: '![暴力枚举树 vs. 最短路节点账本](brute_force_vs_shortest_path_ledger.png) 见 `brute_force_vs_shortest_path_ledger.png`', files: ['brute_force_vs_shortest_path_ledger.png'], tools: [{ id: 'c', name: 'present', status: 'done' }], status: 'done' }] })
  const catalog = { ok: true, current: { provider: 'claude-relay', model: 'claude-opus-5-5', name: 'Claude Opus 5.5', reasoningEffort: 'high', effortName: 'High', images: true },
    groups: [{ id: 'claude-relay', name: 'Claude Relay', models: [{ id: 'claude-opus-5-5', name: 'Claude Opus 5.5', efforts: [{ id: 'high', name: 'High' }, { id: 'max', name: 'Max' }], defaultEffort: 'high', images: true }, { id: 'claude-sonnet-5-5', name: 'Claude Sonnet 5.5', images: true }] },
      { id: 'google', name: 'Google', models: [{ id: 'gemini-4-argon', name: 'Gemini 4 Argon', images: false }] }] }
  window.__DSH_TRANSPORT__ = { async fetch(path, init) {
    const op = path.split('/').pop(); const body = JSON.parse(init.body); window.calls.push({ op, body })
    let data
    if (op === 'models') data = catalog
    else if (op === 'create') data = { ok: true, thread: { id: 't1', title: 'q', selection: body.selection } }
    else if (op === 'view') { if (body.since) await new Promise(r => setTimeout(r, 400)); data = view(body.threadId) }
    else if (op === 'list') data = { ok: true, threads: [] }
    else data = { ok: true }
    return new Response(JSON.stringify(data), { status: 200, headers: { 'content-type': 'application/json' } })
  } }
</script>
<script src="/selection-ask/lib/client.js"></script>
<script>
  const h = React.createElement
  const Delegate = React.createContext({})
  const MarkdownDelegateProvider = function ({ children, openFile, openExternalLink, fileImages }) { return h(Delegate.Provider, { value: { openFile, openExternalLink, fileImages } }, children) }
  const MarkdownText = React.memo(function MarkdownText({ text, pathImages, fileMentions }) {
    const delegate = React.useContext(Delegate)
    const image = /!\[([^\]]*)\]\(([^)]+)\)/.exec(text)
    const code = /`([^`]+)`/.exec(text)
    const mention = code ? fileMentions?.resolve(code[1]) : undefined
    return h('div', { 'data-native-markdown': '' },
      image ? h('img', { 'data-md-image': '', alt: image[1], src: pathImages?.resolve(image[2]) ?? '' }) : null,
      mention ? h('button', { 'data-md-mention': '', title: mention.title, onClick: mention.open }, mention.label) : null,
      h('span', { 'data-has-delegate': typeof delegate.openFile === 'function' && typeof delegate.fileImages?.resolve === 'function' ? 'yes' : 'no' }))
  })
  const mod = window.__registration.factory((id) => {
    if (id === 'react') return React
    if (id === 'react-dom') return ReactDOM
    if (id === '@deepseek-ai/dsh-client-ui-primitives') return { MarkdownText, MarkdownDelegateProvider }
    throw new Error(id)
  })
  const registered = []
  const dictionaries = {}
  const ctx = {
    effect(fn) { fn() },
    locale: { register(ns, dict) { dictionaries[ns] = dict; return () => {} }, bind: (ns) => (key, params = {}) => String(dictionaries[ns]?.zh?.[key] ?? key).replace(/\{(\w+)\}/g, (_, k) => params[k] ?? '') },
    slots: { inject(_, fn) { return fn() }, register(options, component) { registered.push({ options, component }); return () => {} }, entries: () => [], subscribe: () => () => {} },
    sidebarRight: { mounted: { getSnapshot: () => 'sess-main' }, openTab(kind, options) { window.pinned = { kind, options } }, openResource(address, options) { window.openedResource = { address, options } } },
    sidebarRightTabs: { register: () => () => {} },
    sessions: { binding: () => undefined },
    uiConversation: { interactions: { register: () => () => {} } },
  }
  mod.apply(ctx)
  const overlay = registered.find((entry) => entry.options.name === 'shell.overlay')
  ReactDOM.createRoot(document.getElementById('overlay')).render(h(overlay.component, { selectionAsk: overlay.options.inject().selectionAsk }))
  window.selectTool = () => { const node = document.getElementById('tool').firstChild; const range = document.createRange(); range.setStart(node, 0); range.setEnd(node, 8); const selection = getSelection(); selection.removeAllRanges(); selection.addRange(range); document.dispatchEvent(new PointerEvent('pointerup', { bubbles: true })) }
</script>
</body>
</html>
